info:
  name: fetch weather data w lat and long
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/weather?lat=48&long=2
  params:
    - name: lat
      value: "48"
      type: query
    - name: long
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
